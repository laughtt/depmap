# depmap's own pipeline. Runs locally with gitlab-ci-local; on gitlab.com it is the same file.
#
# GitLab DevSecOps stages → jobs
#   1 Plan       depmap:refresh opens security::watch issues; the Duo flow posts investigations on MRs
#   2 Create     build:wasm (Rust → WebAssembly graph core), build:web
#   3 Verify     test:rust, test:server
#   4 Package    package:image (docker build → $CI_REGISTRY_IMAGE; manual on main, automatic on v* tags)
#   5 Secure     depmap:scan + depmap:gate on our own lockfile, CycloneDX SBOM report (depmap gates its own dependencies)
#   6 Release    v* tag: tests → image → depmap scan/gate → GitLab Release with changelog, image and SBOM links; pages
#   7 Configure  .depmap.yml (policy as code, CODEOWNERS), .gitlab/duo/agent-config.yml, flows/depmap.flow.yml, CI/CD variables
#   8 Monitor    depmap:refresh (scheduled pipeline: advisories re-colour every repo)
#   9 Govern     /depmap accept|pin decisions with expiry (audit trail in the events feed), depmap::* MR labels
# The hosted server (https://lac.adtomic.co) is deployed with deploy/ec2-deploy.sh.
#
# Settings > CI/CD > Variables: DEPMAP_TOKEN (masked; = DEPMAP_CI_TOKEN on the depmap host) for depmap:scan.
# The registry login uses the predefined CI_REGISTRY_* variables. Protect the v* tag pattern (Settings > Repository).

include:
  - local: ci/templates/depmap.gitlab-ci.yml

stages: [build, test, depmap, package, release, pages]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^depmap\/fix-/
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH || $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "schedule"

variables:
  DEPMAP_CI_DIR: ci
  DEPMAP_LOCKFILE: pnpm-lock.yaml
  DEPMAP_API_URL: https://lac.adtomic.co

.node:
  image: node:24
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  cache:
    key: { files: [pnpm-lock.yaml] }
    paths: [.pnpm-store]

build:wasm:
  stage: build
  image: rust:1.91
  script:
    - rustup target add wasm32-unknown-unknown
    - curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
    - cd crates/graph-core
    - wasm-pack build --release --target web --out-dir ../../web/src/wasm --out-name graph_core
    - wasm-pack build --release --target nodejs --out-dir ../../server/wasm --out-name graph_core
  artifacts:
    paths: [web/src/wasm, server/wasm]

build:web:
  extends: .node
  stage: build
  needs: [build:wasm]
  script:
    - pnpm --filter web exec tsc --noEmit
    - pnpm --filter web build
  artifacts:
    paths: [web/dist]

test:rust:
  stage: test
  image: rust:1.91
  needs: []
  script:
    - cd crates/graph-core && cargo test --quiet

test:server:
  extends: .node
  stage: test
  needs: []
  services:
    - name: postgres:17
      alias: db
  variables:
    POSTGRES_USER: depmap
    POSTGRES_PASSWORD: depmap
    POSTGRES_DB: depmap
    DATABASE_URL: postgres://depmap:depmap@db:5432/depmap
    TEST_DATABASE_URL: postgres://depmap:depmap@db:5432/depmap
    DATA_MODE: replay
  script:
    - pnpm --filter server test

# depmap gates its own dependencies on MRs and main (from the included template), and on release tags
depmap:scan:
  rules: &depmap-rules
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/

depmap:gate:
  rules: *depmap-rules

package:image:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  needs: [test:server, build:web]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - IMAGE="$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build -f deploy/Dockerfile -t "$IMAGE" .
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push "$IMAGE"

# a v* tag ships only when the tests pass, the image is pushed and depmap's gate passes on depmap's own lockfile
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [package:image, depmap:scan, depmap:gate]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    GIT_DEPTH: 0
  script:
    - apk add --no-cache git >/dev/null
    - git fetch --tags --quiet || true
    - PREV=$(git describe --tags --abbrev=0 --match 'v*' "$CI_COMMIT_TAG^" 2>/dev/null || true)
    - |
      {
        echo "## Changes since ${PREV:-the first commit}"
        git log --no-merges --pretty='- %s (%h)' ${PREV:+$PREV..}$CI_COMMIT_TAG | head -40
        echo
        echo "Container image: \`$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG\`"
        echo "SBOM: CycloneDX, made by depmap scanning its own pnpm-lock.yaml (gate passed)."
      } > CHANGELOG.md
    - cat CHANGELOG.md
  artifacts:
    paths: [gl-sbom-npm-depmap.cdx.json, CHANGELOG.md]
    expire_in: never
  release:
    tag_name: $CI_COMMIT_TAG
    name: depmap $CI_COMMIT_TAG
    description: CHANGELOG.md
    assets:
      links:
        - name: SBOM (CycloneDX, depmap scanned by depmap)
          url: $CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/gl-sbom-npm-depmap.cdx.json
          link_type: other
        - name: depmap page for this release's dependencies
          url: $DEPMAP_API_URL/repos/$CI_PROJECT_PATH
          link_type: other
        - name: Container image $CI_COMMIT_TAG
          url: $CI_PROJECT_URL/container_registry
          link_type: image

pages:
  extends: .node
  stage: pages
  needs: [build:wasm, build:web]
  services:
    - name: postgres:17
      alias: db
  variables:
    POSTGRES_USER: depmap
    POSTGRES_PASSWORD: depmap
    POSTGRES_DB: depmap
    DATABASE_URL: postgres://depmap:depmap@db:5432/depmap
    DATA_MODE: replay
    ADVISORY_FEED: fixtures/feed/simulated-advisory.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - node scripts/seed-demo.ts
    - node scripts/export-pages.ts public --app-url "${DEPMAP_APP_URL:-$CI_PAGES_URL/app}"
    - cp -r web/dist public/app
  artifacts:
    paths: [public]
