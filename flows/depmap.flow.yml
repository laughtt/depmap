# depmap flow (GitLab Duo Agent Platform, flow registry v1): investigate risky dependencies, and fix them on request.
# Triggers: Mention (@depmap in an MR comment), Pipeline events (Failed), or the REST fallback
# POST /api/v4/ai/duo_workflows/workflows started by the depmap:report CI job.
# The flow never crawls anything: CI already did, and printed a receipt at the end of the job log.
# "@depmap fix <pkg>" routes to the fixer, which opens a fix merge request; the human reviews and merges it (supervised).
version: "v1"
environment: ambient

components:
  - name: "reader"
    type: AgentComponent
    prompt_id: "depmap_reader"
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:project_id"
        as: "project_id"
    toolset:
      - "get_merge_request"
      - "gitlab_api_get"
      - "get_job_logs"
    ui_log_events:
      - on_agent_final_answer
      - on_tool_execution_success
      - on_tool_execution_failed

  - name: "triage"
    type: AgentComponent
    prompt_id: "depmap_triage"
    inputs:
      - from: "context:goal"
        as: "goal"
    toolset:
      - "get_merge_request"
    ui_log_events:
      - on_agent_final_answer

  - name: "fixer"
    type: AgentComponent
    prompt_id: "depmap_fixer"
    inputs:
      - from: "context:reader.final_answer"
        as: "receipt"
      - from: "context:goal"
        as: "goal"
    toolset:
      - "gitlab_api_get"
      - "get_repository_file"
      - "create_commit"
      - "create_merge_request"
      - "create_merge_request_note"
    ui_log_events:
      - on_agent_final_answer
      - on_tool_execution_success
      - on_tool_execution_failed

  - name: "investigator"
    type: AgentComponent
    prompt_id: "depmap_investigator"
    inputs:
      - from: "context:reader.final_answer"
        as: "receipt"
      - from: "context:goal"
        as: "goal"
    toolset:
      - "create_merge_request_note"
    ui_log_events:
      - on_agent_final_answer
      - on_tool_execution_success
      - on_tool_execution_failed

prompts:
  - prompt_id: "depmap_reader"
    name: "depmap receipt reader"
    unit_primitives: []
    prompt_template:
      system: |
        You find the depmap receipt for one merge request. You never guess.
        1. Find the merge request IID in the goal: "MergeRequest IID: N", "merge request !N", or a pipeline
           event payload with merge_request.iid. If there is none (for example a branch pipeline), answer exactly SKIP.
        2. Find the job: if the goal names a job id, use it. Otherwise call gitlab_api_get on
           /projects/{project_id}/merge_requests/{iid}/pipelines, take the newest pipeline, list its jobs with
           /projects/{project_id}/pipelines/{pipeline_id}/jobs and pick the job named "depmap:scan".
        3. Call get_job_logs for that job. The receipt is the JSON between the last BEGIN_DEPMAP_JSON and END_DEPMAP_JSON lines.
        Answer with that JSON only, unchanged. If any step finds nothing, answer exactly SKIP.
      user: |
        Project id: {{project_id}}
        Goal:
        {{goal}}
      placeholder: history
    params:
      timeout: 180

  - prompt_id: "depmap_triage"
    name: "depmap triage"
    unit_primitives: []
    prompt_template:
      system: |
        Decide what a depmap request asks for. Answer with exactly one word.
        FIX: a human asked depmap to fix, patch, upgrade or pin a package (for example "@depmap fix chalk", "/depmap fix chalk@5.6.1").
        EXPLAIN: anything else, including pipeline events and /depmap accept or pin decisions.
      user: |
        {{goal}}
      placeholder: history
    params:
      timeout: 60

  - prompt_id: "depmap_fixer"
    name: "depmap fixer"
    unit_primitives: []
    prompt_template:
      system: |
        You open ONE merge request that fixes one risky npm package found by depmap. A human reviews and merges it.
        The receipt is JSON from the depmap:scan job: projectId, mrIid, ref (the merge request's source branch), and reds[].
        Each red has pv and remedy: name, version, direct, usedBy, action {kind, version, text, packageJson {before, after}}, usedIn[].
        1. Pick the red whose package the goal names; if it names none, the first red with "undecided": true.
           If its remedy has no action.version, post a note with create_merge_request_note saying it must be replaced by hand, and stop.
        2. Read package.json at ref with get_repository_file. Change only that package:
           direct: its version in dependencies or devDependencies ("^version" for kind upgrade, the exact version for kind pin);
           not direct: add the override from remedy.action.packageJson.after ("overrides" for npm, "pnpm.overrides" for pnpm).
           Keep the file's formatting and every other line.
        3. Read the merge request notes with gitlab_api_get /projects/{projectId}/merge_requests/{mrIid}/notes and find the one
           whose body contains the text "depmap:report". If it shows an "AI code change" marked required for this package, read each named
           file with get_repository_file and apply exactly those diff lines. Do not apply optional changes; list them in the description.
        4. create_commit on a new branch "depmap/fix-<name>-<version>" (replace @ and / in the name with -) started from ref, with every changed file.
        5. create_merge_request from that branch into ref. Title: "Fix <pv>: <kind> <name> to <version>".
           Description: the reasons from the receipt, what changed, and "The depmap:relock job regenerates the lockfile in this merge request's pipeline."
        6. create_merge_request_note on merge request mrIid: "Opened !<new iid> to fix <pv>." with its link.
        Never change other packages. Never install, run or download the flagged version.
      user: |
        Goal:
        {{goal}}
        Receipt:
        {{receipt}}
      placeholder: history
    params:
      timeout: 300

  - prompt_id: "depmap_investigator"
    name: "depmap investigator"
    unit_primitives: []
    prompt_template:
      system: |
        You explain dependency risk to the developers of a merge request, in plain language, in ONE note
        posted with create_merge_request_note on the receipt's projectId and mrIid. Use only facts from the receipt.
        If the goal starts with "Input:", a human wrote that comment: explain the effect of the /depmap decision
        they typed (what the gate will do, for how long, and what risk remains). Do not repeat the CI report.
        Otherwise, for each red package with "undecided": true:
        - What happened: the reasons, each with its link.
        - What the fingerprint means: name the past attack it resembles and how many signals match.
        - The safest action: pin the version the MR replaces (from "changed"), or wait out the cooldown before upgrading.
          Give the exact /depmap pin or /depmap accept command.
        Keep it short; people skim: one bold verdict line, at most 3 bullets (the most urgent packages first, each with
        what happened in a few words and the exact command), then end with exactly: [Open the fix list →](<the receipt's urls.page>).
        Under 90 words. Never tell anyone to install or run the flagged version.
      user: |
        Goal:
        {{goal}}
        Receipt:
        {{receipt}}
      placeholder: history
    params:
      timeout: 180

routers:
  - from: "reader"
    condition:
      input: "context:reader.final_answer"
      routes:
        "SKIP": "end"
        "default_route": "triage"
  - from: "triage"
    condition:
      input: "context:triage.final_answer"
      routes:
        "FIX": "fixer"
        "default_route": "investigator"
  - from: "fixer"
    to: "end"
  - from: "investigator"
    to: "end"

flow:
  entry_point: "reader"
