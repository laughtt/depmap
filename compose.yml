services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: depmap
      POSTGRES_PASSWORD: depmap
      POSTGRES_DB: depmap
    ports: ["5433:5432"]
    # named, so recreating the container keeps the data
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depmap"]
      interval: 2s
      retries: 20
  mock-gitlab:
    build: { context: ., dockerfile: deploy/Dockerfile }
    command: ["node", "server/src/gitlab/mock.ts"]
    environment: { MOCK_GITLAB_PORT: "8929" }
    ports: ["8929:8929"]
    profiles: [full]
  api:
    build: { context: ., dockerfile: deploy/Dockerfile }
    environment:
      DATABASE_URL: postgres://depmap:depmap@db:5432/depmap
      PORT: "8080"
      DATA_MODE: replay
      APP_SECRET: local-dev-secret-change-me
    ports: ["8080:8080"]
    depends_on: { db: { condition: service_healthy } }
    profiles: [full]
  # a real GitLab CE + runner for the full pipeline locally: node scripts/local-gitlab.mjs
  gitlab:
    image: gitlab/gitlab-ce:19.5.1-ce.0
    hostname: gitlab
    shm_size: 256m
    ports: ["8090:8090"]
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8090'
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD:?set GITLAB_ROOT_PASSWORD to a strong password}'
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
        gitlab_kas['enable'] = false
        registry['enable'] = false
    volumes: [gitlab-config:/etc/gitlab, gitlab-data:/var/opt/gitlab, gitlab-logs:/var/log/gitlab]
    profiles: [gitlab]
  gitlab-runner:
    image: gitlab/gitlab-runner:v19.5.1
    volumes: [/var/run/docker.sock:/var/run/docker.sock, gitlab-runner:/etc/gitlab-runner]
    profiles: [gitlab]

volumes:
  db-data:
  gitlab-config:
  gitlab-data:
  gitlab-logs:
  gitlab-runner:
