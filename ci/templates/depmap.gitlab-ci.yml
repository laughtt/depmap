# depmap: dependency supply-chain map and gate for any npm project.
#
#   include:
#     - remote: https://<depmap host>/ci/templates/depmap.gitlab-ci.yml
#   stages: [..., depmap]          # add the stage if you define your own list
#
# CI/CD variables (Settings > CI/CD > Variables):
#   DEPMAP_API_URL      the depmap server (required)
#   DEPMAP_APP_URL      UI origin for the map image and links (default: DEPMAP_API_URL)
#   DEPMAP_TOKEN        bearer token, when the depmap server has login on (masked variable)
#   GITLAB_TOKEN        masked; api scope, used to post the MR note, label and upload (default: CI_JOB_TOKEN)
#   DEPMAP_START_FLOW   "1" to start the Duo investigation flow over REST when the gate fails
#   DEPMAP_FLOW_CONSUMER_ID   the flow's AI catalog consumer id (for the REST start)
#   DEPMAP_AS_OF        optional ISO time, replays risk as it was at that moment
#   DEPMAP_LOCKFILE     default package-lock.json, then pnpm-lock.yaml
#   DEPMAP_RENDER_URL   the UI as the report job's browser reaches it, if different from DEPMAP_APP_URL
# CI does all the crawling and spends 0 GitLab credits; the flow only reads the receipt at the end of the scan log.
#
# Policy as code: a .depmap.yml at the repo root (cooldown_hours, block_on, allow, licenses.deny) is sent with every scan;
# the gate log names the policy rule that failed. Protect it with CODEOWNERS.
#
# depmap:relock: the Duo flow's fix MRs (branches depmap/fix-<pkg>-<version>) edit package.json but cannot regenerate
# the lockfile. On those branches this job does it (no install, no scripts) and pushes it back with GITLAB_TOKEN
# (needs write_repository); the push starts a new pipeline that scans the fixed lockfile. Nothing changed: no push, no loop.

stages: [depmap]

.depmap:
  stage: depmap
  image: node:22
  before_script:
    - DEPMAP_CI_DIR="${DEPMAP_CI_DIR:-.depmap}"
    - |
      if [ ! -f "$DEPMAP_CI_DIR/depmap-scan.mjs" ]; then
        mkdir -p "$DEPMAP_CI_DIR"
        for f in lib scan gate render post sbom refresh; do
          curl -fsSL "${DEPMAP_SCRIPTS_URL:-$DEPMAP_API_URL/ci}/depmap-$f.mjs" -o "$DEPMAP_CI_DIR/depmap-$f.mjs"
        done
        if [ "$CI_JOB_NAME" = "depmap:report" ]; then npm install --no-save --prefix "$DEPMAP_CI_DIR" playwright-core@1.64.1 >/dev/null 2>&1 || true; fi
      fi

depmap:relock:
  extends: .depmap
  before_script: []
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^depmap\/fix-/
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  script:
    - |
      if [ -f pnpm-lock.yaml ]; then LOCK=pnpm-lock.yaml; corepack enable && pnpm install --lockfile-only --ignore-scripts
      else LOCK=package-lock.json; npm install --package-lock-only --ignore-scripts --no-audit --no-fund; fi
      git add "$LOCK"
      if git diff --cached --quiet; then echo "depmap: $LOCK is up to date"; exit 0; fi
      git -c user.name=depmap-bot -c user.email=depmap-bot@noreply.gitlab.com commit -m "depmap: regenerate lockfile"
      git push "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:$CI_COMMIT_BRANCH"

depmap:scan:
  extends: .depmap
  needs:
    - job: depmap:relock
      optional: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - node "$DEPMAP_CI_DIR/depmap-scan.mjs"
    - node "$DEPMAP_CI_DIR/depmap-sbom.mjs"
  artifacts:
    when: always
    paths: [depmap.json, gl-sbom-npm-depmap.cdx.json]
    reports:
      cyclonedx: gl-sbom-npm-depmap.cdx.json

depmap:gate:
  extends: .depmap
  needs: [depmap:scan]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - node "$DEPMAP_CI_DIR/depmap-gate.mjs"

depmap:report:
  extends: .depmap
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  needs:
    - depmap:scan
    - job: depmap:gate
      artifacts: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
  script:
    - node "$DEPMAP_CI_DIR/depmap-render.mjs" || true
    - node "$DEPMAP_CI_DIR/depmap-post.mjs"

# Schedule a pipeline in any one project (Build > Pipeline schedules): watchers poll, every repo is re-assessed,
# and a security::watch issue opens in each project where a package turned red.
depmap:refresh:
  extends: .depmap
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - node "$DEPMAP_CI_DIR/depmap-refresh.mjs"
